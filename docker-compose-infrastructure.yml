services:
  demo-database:
    image: postgres:17-alpine
    env_file:
      - ./apps/backend/.env
    # environment:
    #   - POSTGRES_USER=${POSTGRES_USER}
    #   - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    #   - POSTGRES_DB=${POSTGRES_DB}
    #   - DB_HOST=${DB_HOST}
    ports:
      - "5432:5432"
    networks:
      - custom-network
    container_name: postgres_db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
networks:
  custom-network:
    external: true
volumes:
  postgres_data:
    external: true
    name: full-stack-nextjs_postgres_data
