services:
  demo-database:
    image: postgres:17-alpine
    env_file:
      - ./apps/backend/.env
    ports:
      - "5432:5432"
    networks:
      - custom-network
    container_name: postgres_db
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/backend/src/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  demo-backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "3001:3001"
    restart: always
    networks:
      - custom-network
    env_file:
      - ./apps/backend/.env
    depends_on:
      demo-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "dist/health_check.js"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  demo-frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3000:3000"
    networks:
      - custom-network
    env_file:
      - ./apps/frontend/.env
    depends_on:
      demo-backend:
        condition: service_healthy

networks:
  custom-network:
    external: true
volumes:
  postgres_data: