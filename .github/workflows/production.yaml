name: production-ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: setup nodejs
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: setup pnpm manager
        uses: pnpm/action-setup@v4
        with:
          version: 9.0
      - name: install dependencies
        with: pnpm install --frozen-lockfile
      - name: lint
        with: pnpm lint
      - name: build
        with: pnpm build
